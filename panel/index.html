<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GarServoPet component simulator</title>
    <script type="module" src="/components/bridge-status.js"></script>
    <script type="module" src="./components/pca9685.js"></script>
    <script type="module" src="./components/sg90.js"></script>
    <link rel="stylesheet" href="./panel.css">
  </head>
  <body>
    <main>
      <header class="page-heading">
        <div><p>GARSERVO PET</p><h1>Hardware component simulator</h1></div>
        <gar-bridge-status></gar-bridge-status>
      </header>
      <p class="lead">VM上のアプリが出力したPCA9685のPWMを、接続可能な物理部品単位で表示します。</p>
      <div class="component-grid">
        <gar-pca9685 id="pca9685-1" device="/dev/i2c-1" address="0x40"></gar-pca9685>
        <section class="servo-bank" aria-labelledby="servo-bank-title">
          <header><span class="eyebrow">CONNECTED ACTUATORS</span><h2 id="servo-bank-title">SG90 servos</h2></header>
          <div class="servo-grid">
            <gar-sg90 id="sg90-1" controller="pca9685-1" channel="0"></gar-sg90>
            <gar-sg90 id="sg90-2" controller="pca9685-1" channel="1"></gar-sg90>
            <gar-sg90 id="sg90-3" controller="pca9685-1" channel="2"></gar-sg90>
            <gar-sg90 id="sg90-4" controller="pca9685-1" channel="3"></gar-sg90>
          </div>
          <p class="calibration-note">角度はプレビュー値です。実機の可動範囲は各サーボの校正値で置き換えます。</p>
        </section>
      </div>
    </main>
  </body>
</html>
